name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 单元测试与集成测试
        run: cargo test --all-targets
      - name: 编译检查（含 JNI 特性）
        run: cargo check --features jni
      - name: 示例可运行
        run: cargo run --example preview -- "x^2"
